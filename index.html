<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lista de coroinhas carregada de um arquivo JSON.">
    <meta name="author" content="Enio Antonio S. Júnior">
    <title>Coroinhas cadastrados</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <script src="script.js"></script>
